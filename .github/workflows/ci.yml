name: CI

# The legacy code had no CI at all, so nothing verified a commit. This runs the
# same checks locally and on every push, and gates the branch on them.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # The suites start their own in-memory MongoDB, so no service container
        # is needed. These are throwaway values for the test environment.
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-long-enough-to-satisfy-validation
          MONGODB_URI: mongodb://in-memory-server-supplies-the-real-uri/srms_test

      - name: Build
        run: npm run build

  parity:
    name: Parity against recorded legacy behaviour
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Check for undeclared behaviour changes
        # Exits non-zero when a difference from the recorded contract has no
        # declared reason, so a silent change fails the build.
        run: npx tsx src/scripts/verifyParity.ts
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-long-enough-to-satisfy-validation
          MONGODB_URI: mongodb://in-memory-server-supplies-the-real-uri/parity

      - name: Upload the reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: .planning/contract/PARITY.md
          if-no-files-found: warn

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for tracked env files and credential-shaped strings
        run: |
          set -euo pipefail

          # A tracked .env is how the sibling IDP repository leaked a live
          # database URL and signing key.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Only .env.example belongs in git."
            exit 1
          fi

          # Connection strings carrying inline credentials.
          matches=$(git grep -nE 'mongodb(\+srv)?://[^:/@[:space:]]+:[^@[:space:]]+@' \
            -- ':!*.example' ':!.github/*' ':!.planning/*' || true)

          # Documentation has to show the shape of a connection string, and that
          # shape necessarily looks like a credential. Placeholders are listed
          # explicitly rather than excluding whole files, so a real credential in
          # a README is still caught.
          real=$(printf '%s\n' "$matches" \
            | grep -vE 'USER:PASSWORD|<user>:<password>|<username>:<password>|xxxxx' \
            | grep -v '^$' || true)

          if [ -n "$real" ]; then
            echo "$real"
            echo "::error::A connection string with an inline password is committed."
            exit 1
          fi

          echo "No tracked env files and no inline credentials found."
